<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>CEO Makam Odası - Elektronik Kapı Kilidi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-door { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; max-width: 480px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="card-door p-4">
    <div class="text-center mb-4">
        <div class="fs-1 text-warning mb-2"><i class="fa-solid fa-door-closed"></i></div>
        <h4 class="fw-bold text-white mb-1">CEO Makam Odası & Terminal</h4>
        <p class="text-secondary small">DevPuan mağazasından edindiğiniz kapı erişim şifresini (Flag 1) giriniz.</p>
    </div>

    {% if message %}
    <div class="alert alert-danger py-2 small text-center" role="alert">
        {{ message }}
    </div>
    {% endif %}

    <form action="/ceo-door" method="POST">
        <div class="mb-3">
            <label class="form-label text-secondary small">Erişim Anahtarı / Şifre:</label>
            <input type="text" name="door_code" class="form-control bg-dark text-warning border-secondary font-monospace" placeholder="TUGA{...}" required>
        </div>
        <button type="submit" class="btn btn-warning w-100 fw-bold py-2">
            <i class="fa-solid fa-unlock me-1"></i> Kapıyı Aç & Odaya Gir
        </button>
    </form>
    
    <div class="mt-3 text-center">
        <a href="/" class="text-info text-decoration-none small">← Mağazaya Geri Dön</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
